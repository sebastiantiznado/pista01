<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso · El Umbral</title>

  <style>
    :root {
      color-scheme: dark;
      --texto: #e5e7df;
      --acento: #bdc8a5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background: #080e12;
      color: var(--texto);
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Escenario de fondo */
    .escenario {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 72% 22%, #647b7930, transparent 36%),
        linear-gradient(#080e16 0%, #152225 65%, #080e0e 100%);
    }

    .luna {
      position: absolute;
      top: 13%;
      right: 22%;
      width: clamp(70px, 10vw, 125px);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 36% 33%, #a6b3a535, transparent 23%),
        radial-gradient(circle at 65% 62%, #8d9c8b40, transparent 30%),
        #d6dfce;
      box-shadow:
        0 0 45px #d6dfce18,
        0 0 130px #d6dfce16;
      opacity: .78;
    }

    .cementerio {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 53%;
    }

    .niebla {
      position: absolute;
      left: -35%;
      bottom: -10%;
      width: 170%;
      height: 55%;
      background:
        radial-gradient(ellipse at 25% 60%, #a0b6ad1c, transparent 48%),
        radial-gradient(ellipse at 70% 70%, #a0b6ad24, transparent 45%);
      filter: blur(25px);
      animation: flotar 24s ease-in-out infinite alternate;
    }

    .niebla.segunda {
      bottom: 4%;
      opacity: .5;
      animation-duration: 34s;
      animation-direction: alternate-reverse;
    }

    .vineta {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse at center,
        transparent 20%,
        #03070980 100%
      );
    }

    /* Tarjeta de acceso */
    .acceso {
      position: relative;
      z-index: 1;
      width: min(400px, calc(100% - 40px));
      margin: 48px 0;
      padding: 42px 32px 32px;
      text-align: center;
      border: 1px solid #c5d0b525;
      border-radius: 20px;
      background: linear-gradient(145deg, #182124d9, #0b1215ed);
      box-shadow:
        0 30px 90px #0008,
        inset 0 1px 0 #ffffff08;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .acceso::before {
      content: "";
      position: absolute;
      top: -1px;
      left: 22%;
      right: 22%;
      height: 1px;
      background: linear-gradient(
        90deg, transparent, #bdc8a590, transparent
      );
    }

    .emblema {
      width: 54px;
      height: 54px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border: 1px solid #bdc8a530;
      border-radius: 50%;
      color: var(--acento);
      background: #bdc8a507;
      box-shadow: 0 0 30px #bdc8a508;
    }

    .categoria {
      margin: 0 0 12px;
      font-size: 10px;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: #a6b19b;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: clamp(32px, 7vw, 40px);
      letter-spacing: .03em;
    }

    .descripcion {
      margin: 15px 0 30px;
      font-size: 13px;
      line-height: 1.7;
      color: #a5b0af;
    }

    label {
      display: block;
      margin-bottom: 10px;
      text-align: left;
      font-size: 11px;
      letter-spacing: .1em;
      color: #c0c9bf;
    }

    .campo {
      position: relative;
    }

    .campo svg {
      position: absolute;
      top: 50%;
      left: 16px;
      transform: translateY(-50%);
      color: #89988e;
      pointer-events: none;
    }

    input {
      width: 100%;
      min-height: 54px;
      padding: 16px 16px 16px 46px;
      background: #060d10a6;
      border: 1px solid #899a803d;
      border-radius: 10px;
      color: var(--texto);
      font: inherit;
      font-size: 16px;
      outline: none;
      transition: border-color .25s, box-shadow .25s;
    }

    input::placeholder {
      color: #7f8e8b;
      font-size: 13px;
    }

    input:hover {
      border-color: #aab89970;
    }

    input:focus-visible {
      border-color: var(--acento);
      box-shadow: 0 0 0 3px #bdc8a518;
    }

    .pie {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 26px 0 0;
      color: #8a9995;
      font-size: 9px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .pie::before,
    .pie::after {
      content: "";
      width: 24px;
      height: 1px;
      background: #bdc8a52b;
    }

    @keyframes flotar {
      from { transform: translateX(-5%); }
      to   { transform: translateX(8%); }
    }

    @media (max-width: 480px) {
      .acceso {
        padding: 34px 24px 28px;
      }

      .luna {
        top: 8%;
        right: 12%;
      }

      .cementerio {
        width: 180%;
        max-width: none;
        left: -40%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .niebla {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div class="escenario" aria-hidden="true">
    <div class="luna"></div>

    <svg
      class="cementerio"
      viewBox="0 0 1440 420"
      preserveAspectRatio="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <!-- Colina distante -->
      <path
        d="M0 290 Q250 235 480 290 T980 275 T1440 280 V420 H0Z"
        fill="#101c1e"
      />

      <!-- Cruces y lápidas lejanas -->
      <g fill="#0c1618">
        <path d="M185 284V202h13v22h22v12h-22v48Z"/>
        <path d="M357 280v-49a23 23 0 0 1 46 0v49Z"/>
        <path d="M1040 285v-57a26 26 0 0 1 52 0v57Z"/>
        <path d="M1200 278v-96h14v26h25v12h-25v58Z"/>
      </g>

      <!-- Árboles secos -->
      <g
        fill="none"
        stroke="#080f12"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M82 365 103 189 85 98 94 20" stroke-width="18"/>
        <path d="M100 220 44 159 17 92" stroke-width="10"/>
        <path d="M91 150 151 100 171 39" stroke-width="9"/>
        <path d="M47 162 7 146M144 108 203 87" stroke-width="5"/>

        <path d="M1360 365 1338 213 1354 112 1332 34" stroke-width="19"/>
        <path d="M1341 238 1400 172 1421 95" stroke-width="10"/>
        <path d="M1347 163 1290 115 1270 60" stroke-width="8"/>
        <path d="M1294 119 1246 111M1397 177 1436 161" stroke-width="5"/>
      </g>

      <!-- Suelo y lápidas cercanas -->
      <path
        d="M0 352 Q240 298 480 347 T950 335 T1440 329 V420 H0Z"
        fill="#080f11"
      />

      <g fill="#080f11">
        <path d="M258 351v-72a32 32 0 0 1 64 0v72Z"/>
        <path d="M1131 346v-89a36 36 0 0 1 72 0v89Z"/>
        <path d="M419 352v-78h13v21h23v12h-23v45Z"/>
        <path d="M994 349v-71h12v20h21v11h-21v40Z"/>
      </g>

      <!-- Grabados discretos -->
      <g stroke="#718177" stroke-opacity=".18" fill="none">
        <path d="M290 270v35m-11-23h22"/>
        <path d="M1167 247v38m-12-25h24"/>
      </g>
    </svg>

    <div class="niebla"></div>
    <div class="niebla segunda"></div>
    <div class="vineta"></div>
  </div>

  <main class="acceso" aria-labelledby="titulo">
    <div class="emblema" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="1.2">
        <path d="M18.5 15.7A8 8 0 0 1 8.3 5.5
                 8 8 0 1 0 18.5 15.7Z"/>
        <path d="M17 3v4m-2-2h4"/>
      </svg>
    </div>

    <p class="categoria">Más allá del silencio</p>
    <h1 id="titulo">El Umbral</h1>
    <p class="descripcion">
      Algunos secretos solo se revelan<br>
      a quienes poseen la llave.
    </p>

    <label for="contrasena">CONTRASEÑA DE ACCESO</label>

    <div class="campo">
      <svg width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="1.5"
           aria-hidden="true">
        <rect x="5" y="10" width="14" height="11" rx="2"/>
        <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
        <circle cx="12" cy="15" r="1"/>
        <path d="M12 16v2"/>
      </svg>

      <input
        id="contrasena"
        name="contrasena"
        type="password"
        placeholder="Introduce tu contraseña"
        autocomplete="current-password"
      >
    </div>

    <p class="pie">El silencio custodia este lugar</p>
  </main>
</body>
</html>
