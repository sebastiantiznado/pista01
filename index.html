<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
        }

        input {
            width: 250px;
            padding: 14px;
            background: #151515;
            border: 1px solid #333;
            border-radius: 6px;
            color: white;
            font-size: 15px;
            text-align: center;
            outline: none;
        }

        input:focus {
            border-color: #666;
        }

        input::placeholder {
            color: #777;
        }
    </style>
</head>

<body>

    <input
        type="password"
        placeholder="Contraseña"
        aria-label="Contraseña"
    >

</body>
</html>
